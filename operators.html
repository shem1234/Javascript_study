<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x = 5
        let y = "5"
        console.log(x == y) // true
        console.log(x === y) // false

        let num1 = 10
        let num2 = 23
        let num3 = num1 + num2
        console.log(num3) // 33

        let a = 10
        a += 23
        console.log(a) // 33

        let b = 10
        b -= 23
        console.log(b) // -13






    </script>


</body>
</html>
